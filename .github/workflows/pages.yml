# Publishes the interactive demo in site/ to GitHub Pages.
# One-time setup by a repo admin: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# site/ is built by `python scripts/build_standalone_demo.py site`; tests/test_site_build.py fails if it is stale.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
