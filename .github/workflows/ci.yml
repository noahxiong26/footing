name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Same check as scripts/clean_install_check.sh: the installed package (not the repo) serves the app.
      - run: bash scripts/clean_install_check.sh
