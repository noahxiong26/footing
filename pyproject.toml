[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footing-pipeline"
version = "0.1.0"
description = "Open public-data pipeline that feeds Footing's Settle Score (hackathon build)."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "qrcode>=7.4"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9", "qrcode>=7.4", "openpyxl>=3.1", "playwright>=1.40"]

[project.scripts]
footing = "footing.cli:main"

[tool.setuptools.packages.find]
include = ["footing*"]

[tool.setuptools.package-data]
footing = ["static/*.json", "static/*.csv", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
