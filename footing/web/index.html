<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="description" content="Footing: where in Virginia could you land? All 133 cities and counties scored for you from public data, with every source shown.">
<title>Footing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Overpass:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="globe.css">
</head>
<body>
<div id="globe-root" hidden>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="globe-map" aria-label="Map of Virginia's cities and counties, colored by how well each fits you. The List button shows the same information as a list."></div>
  <div class="g-loading" role="status">Loading the map...</div>
  <div class="g-top">
    <a href="#/" class="g-brand" aria-label="Footing home">FOOTING</a>
    <button type="button" class="g-btn" id="g-listbtn">List</button>
    <select class="g-btn g-langsel" id="g-lang" aria-label="Language"></select>
    <button type="button" class="g-btn hide" id="g-hide">Hide this page</button>
  </div>
  <div class="g-legend">
    <div class="g-ramp"><span id="g-low">Poor fit</span><span class="bar" aria-hidden="true"></span><span id="g-high">Good fit</span>
      <span class="unk"><i aria-hidden="true"></i><span id="g-unk">No data</span></span></div>
    <select class="g-layer" id="g-layer" aria-label="Color the map by"></select>
  </div>
  <section class="g-sheet" aria-label="Details"></section>
</div>
<header class="top">
  <a href="#/" class="brand" aria-label="Footing home">FOOTING</a>
  <span class="tag">No sign-in. Your answers stay on this phone.</span>
</header>
<main id="view" tabindex="-1" aria-live="polite"></main>
<noscript><p class="pad">Footing needs JavaScript. You can still call 211 for help.</p></noscript>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="fit.js"></script>
<script src="vafit.js"></script>
<script src="i18n.js"></script>
<script src="i18n_more.js"></script>
<script src="globe.js"></script>
<script src="app.js"></script>
</body>
</html>
